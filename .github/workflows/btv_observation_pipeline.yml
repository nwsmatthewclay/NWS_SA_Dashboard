name: BTV Observation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "scripts/observation_pipeline.py"
      - "scripts/observation_source_probe.py"
      - "scripts/asos_metar.py"
      - "cloudflare/worker.js"
      - "cloudflare/wrangler.toml"
      - "tests/test_observation_pipeline.py"
      - "tests/test_synoptic_nysm.py"
      - "tests/test_asos_metar.py"
      - ".github/workflows/btv_observation_pipeline.yml"

permissions:
  contents: read

concurrency:
  group: btv-observation-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OBSERVATION_WORKER_URL: ${{ secrets.OBSERVATION_WORKER_URL }}
      OBSERVATION_INGEST_TOKEN: ${{ secrets.OBSERVATION_INGEST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/worker.js

      - name: Ingest observations
        env:
          SYNOPTIC_API_KEY: ${{ secrets.SYNOPTIC_API_KEY }}
          OBSERVATION_LOOKBACK_DAYS: "5"
        run: python scripts/observation_pipeline.py

      - name: Validate snapshot and daily archive partitions
        run: |
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path("observation_data/latest")
          manifest = json.loads((base / "manifest.json").read_text())
          stations = json.loads((base / "stations.json").read_text())
          with gzip.open(base / "observations.ndjson.gz", "rt", encoding="utf-8") as stream:
              rows = [json.loads(line) for line in stream if line.strip()]

          assert len(rows) == manifest["observation_count"], (len(rows), manifest["observation_count"])
          assert stations and rows, "Snapshot must contain stations and observations"
          assert all(row.get("observation_time") and row.get("ingested_at") for row in rows)
          assert all(row.get("latest_observation_at") for row in rows)

          archive_root = Path("observation_data/archive")
          archive_files = sorted(archive_root.glob("*/*/*.ndjson.gz"))
          assert archive_files, "Daily partition files were not generated"

          expected_by_day = {}
          for row in rows:
              raw_time = row.get("observation_time")
              try:
                  parsed = datetime.fromisoformat(str(raw_time).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  day_key = parsed.astimezone(timezone.utc).strftime("%Y-%m-%d")
                  expected_by_day.setdefault(day_key, []).append(row)
              except (TypeError, ValueError):
                  continue

          actual_by_day = {}
          for path in archive_files:
              key = path.name.removesuffix(".ndjson.gz")
              partition_day = key
              assert path.relative_to(archive_root).as_posix() == f"{partition_day[:4]}/{partition_day[5:7]}/{partition_day}.ndjson.gz", f"Malformed archive path: {path}"
              with gzip.open(path, "rt", encoding="utf-8") as stream:
                  partition_rows = [json.loads(line) for line in stream if line.strip()]
              assert partition_rows, f"Empty archive partition: {path}"
              for row in partition_rows:
                  parsed = datetime.fromisoformat(str(row["observation_time"]).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  assert parsed.astimezone(timezone.utc).strftime("%Y-%m-%d") == partition_day, f"Row placed in wrong partition: {path}"
              actual_by_day[partition_day] = partition_rows

          assert set(actual_by_day) == set(expected_by_day), (sorted(actual_by_day), sorted(expected_by_day))
          for day, expected_rows in expected_by_day.items():
              actual_rows = actual_by_day[day]
              assert len(actual_rows) == len(expected_rows), (day, len(actual_rows), len(expected_rows))
          archived_count = sum(len(partition) for partition in actual_by_day.values())
          expected_archived_count = sum(len(partition) for partition in expected_by_day.values())
          assert archived_count == expected_archived_count
          print(f"Validated {len(archive_files)} daily partitions and {archived_count} archived observations")
          print(f"Validated {len(rows)} snapshot observations and {len(stations)} provider station records")
          PY

      - name: Publish latest snapshot to Cloudflare R2 API
        if: ${{ env.OBSERVATION_WORKER_URL != '' && env.OBSERVATION_INGEST_TOKEN != '' }}
        run: |
          set -euo pipefail
          BASE_URL="${OBSERVATION_WORKER_URL%/}"
          for KEY in observations.ndjson.gz stations.json manifest.json; do
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $OBSERVATION_INGEST_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@observation_data/latest/$KEY" \
              "$BASE_URL/ingest/latest/$KEY"
          done
          for FILE in observation_data/archive/*/*/*.ndjson.gz; do
            [ -f "$FILE" ] || continue
            KEY="${FILE#observation_data/}"
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $OBSERVATION_INGEST_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "$BASE_URL/ingest/$KEY"
          done

      - name: Upload normalized observation archive
        uses: actions/upload-artifact@v4
        with:
          name: btv-observation-data-${{ github.run_id }}
          path: observation_data/
          if-no-files-found: error
          retention-days: 14
