name: BTV Observation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "scripts/observation_pipeline.py"
      - "scripts/asos_metar.py"
      - "cloudflare/worker.js"
      - "cloudflare/wrangler.toml"
      - "tests/test_observation_pipeline.py"
      - ".github/workflows/btv_observation_pipeline.yml"

permissions:
  contents: read

concurrency:
  group: btv-observation-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OBSERVATION_WORKER_URL: ${{ secrets.OBSERVATION_WORKER_URL }}
      OBSERVATION_INGEST_TOKEN: ${{ secrets.OBSERVATION_INGEST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/worker.js

      - name: Ingest observations
        env:
          SYNOPTIC_API_KEY: ${{ secrets.SYNOPTIC_API_KEY }}
          OBSERVATION_LOOKBACK_DAYS: "5"
        run: python scripts/observation_pipeline.py

      - name: Validate normalized snapshot files
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          base = Path("observation_data/latest")
          manifest = json.loads((base / "manifest.json").read_text())
          stations = json.loads((base / "stations.json").read_text())
          with gzip.open(base / "observations.ndjson.gz", "rt", encoding="utf-8") as stream:
              rows = [json.loads(line) for line in stream if line.strip()]
          assert len(rows) == manifest["observation_count"], (len(rows), manifest["observation_count"])
          assert stations and rows, "Snapshot must contain stations and observations"
          assert all(row.get("observation_time") and row.get("ingested_at") for row in rows)
          assert all(row.get("latest_observation_at") for row in rows)
          print(f"Validated {len(rows)} observations and {len(stations)} provider station records")
          PY

      - name: Publish latest snapshot to Cloudflare R2 API
        if: ${{ env.OBSERVATION_WORKER_URL != '' && env.OBSERVATION_INGEST_TOKEN != '' }}
        run: |
          set -euo pipefail
          BASE_URL="${OBSERVATION_WORKER_URL%/}"
          for KEY in observations.ndjson.gz stations.json manifest.json; do
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $OBSERVATION_INGEST_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@observation_data/latest/$KEY" \
              "$BASE_URL/ingest/latest/$KEY"
          done

      - name: Upload normalized observation archive
        uses: actions/upload-artifact@v4
        with:
          name: btv-observation-data-${{ github.run_id }}
          path: observation_data/
          if-no-files-found: error
          retention-days: 14
