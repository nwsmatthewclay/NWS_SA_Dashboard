name: Deploy BTV Observation API

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy_observation_worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBSERVATION_INGEST_TOKEN: ${{ secrets.OBSERVATION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip deployment when credentials are not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.OBSERVATION_INGEST_TOKEN == '' }}
        run: echo "::notice::Cloudflare deployment skipped. Configure the required repository Actions secrets when the R2 bucket is ready."

      - name: Install Wrangler
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.OBSERVATION_INGEST_TOKEN != '' }}
        run: npm install --global wrangler@4

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.OBSERVATION_INGEST_TOKEN != '' }}
        run: wrangler deploy --config cloudflare/wrangler.toml

      - name: Set Worker ingest secret
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.OBSERVATION_INGEST_TOKEN != '' }}
        run: printf '%s' "$OBSERVATION_INGEST_TOKEN" | wrangler secret put INGEST_SECRET --config cloudflare/wrangler.toml
