name: Mesoscale Model Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: mesoscale-model-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install discovery dependency
        run: python -m pip install --upgrade requests
      - name: Discover latest RAP and HRRR products
        run: python mesoscale/discover_models.py --days-back 2 --index-latest
      - name: Commit updated model manifest
        run: |
          if git diff --quiet -- mesoscale/data/model_manifest.json; then
            echo "Model manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesoscale/data/model_manifest.json
          git commit -m "Update RAP and HRRR discovery manifest"
          git push
