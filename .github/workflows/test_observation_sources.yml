name: Test IRIS Observation Data Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagnostic dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run ASOS/METAR parser tests\n        run: python -m unittest discover -s tests -p 'test_asos_metar.py' -v\n\n      - name: Probe observation data sources
        env:
          SYNOPTIC_API_KEY: ${{ secrets.SYNOPTIC_API_KEY }}
        run: python scripts/observation_source_probe.py

      - name: Upload sanitized probe report
        uses: actions/upload-artifact@v4
        with:
          name: observation-source-probe
          path: observation_source_probe.json
          if-no-files-found: error
          retention-days: 14
