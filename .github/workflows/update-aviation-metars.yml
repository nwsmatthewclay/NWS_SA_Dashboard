name: Refresh Aviation METAR Fallback

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_aviation_metars.py"
      - ".github/workflows/update-aviation-metars.yml"

permissions:
  contents: write

concurrency:
  group: aviation-metar-feed
  cancel-in-progress: false

jobs:
  refresh-metar-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch and validate METAR reports
        run: python scripts/update_aviation_metars.py
      - name: Commit changed feed
        run: |
          # git diff ignores untracked files, which is how this feed is first created.
          if [ -z "$(git status --porcelain -- data/aviation_metars.json)" ]; then
            echo "METAR feed unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/aviation_metars.json
          git commit -m "Refresh aviation METAR fallback"
          git push
