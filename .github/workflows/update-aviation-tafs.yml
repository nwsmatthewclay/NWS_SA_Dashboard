name: Update Aviation TAF Feed

on:
  push:
    paths:
      - "scripts/update_aviation_tafs.py"
      - "data/aviation_tafs.json"
      - ".github/workflows/update-aviation-tafs.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aviation-taf-feed
  cancel-in-progress: false

jobs:
  update-tafs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch and validate TAFs
        run: python scripts/update_aviation_tafs.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- data/aviation_tafs.json; then
            echo "TAFs unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aviation_tafs.json
          git commit -m "Refresh aviation TAF feed"
          git push
