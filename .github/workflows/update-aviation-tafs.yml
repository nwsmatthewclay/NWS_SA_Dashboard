name: Update Aviation TAF Feed

on:
  push:
    paths:
      - "scripts/update_aviation_tafs.py"
      - "data/aviation_tafs.json"
      - "data/aviation_obs.json"
      - ".github/workflows/update-aviation-tafs.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aviation-taf-feed
  cancel-in-progress: false

jobs:
  update-tafs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch and validate TAFs
        run: python scripts/update_aviation_tafs.py
      - name: Commit changed aviation feeds
        if: always()
        run: |
          # Stage first so a newly-created observation JSON file is not missed by git diff.
          git add data/aviation_tafs.json
          if [ -f data/aviation_obs.json ]; then
            git add data/aviation_obs.json
          fi
          if git diff --cached --quiet; then
            echo "Aviation feeds unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh aviation TAF and observation feeds"
          # Other dashboard automation can push to main while this job is running.
          # Rebase our data-only commit before pushing so the new feed is not lost.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
