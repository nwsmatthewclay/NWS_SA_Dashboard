name: Update Severe Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so this job can commit PNGs back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (eccodes, geos, proj)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev libgeos-dev libproj-dev proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show trigger type
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run main data pipeline (BUFKIT params + GLWU animation)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NCEI_CDO_TOKEN: ${{ secrets.NCEI_CDO_TOKEN }}
          GLWU_DRIVE_FOLDER_ID: ${{ secrets.GLWU_DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Run Mansfield temperature profile script
        run: python tempprofile.py

      - name: Commit dashboard outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/
          git commit -m "Update dashboard outputs [skip ci]" || echo "No changes to commit"
          git pull --rebase
          git push
