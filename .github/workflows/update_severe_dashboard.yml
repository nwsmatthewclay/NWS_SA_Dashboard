name: NWS Situational Awareness Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scipy requests beautifulsoup4 lxml pillow imageio gspread google-auth google-api-python-client pygrib cartopy metpy

      - name: Run main dashboard
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GLWU_GOOGLE_CREDENTIALS: ${{ secrets.GLWU_GOOGLE_CREDENTIALS }}
          GLWU_DRIVE_FOLDER_ID: ${{ secrets.GLWU_DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Generate Mount Mansfield sounding and diagnostics
        run: python tempprofile.py

      - name: Generate Mount Mansfield snow depth
        run: python MansfieldSnowDepth.py

      - name: Upload generated dashboard outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-outputs-${{ github.run_number }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit generated dashboard outputs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add outputs/

        if git diff --cached --quiet; then
          echo "No generated output changes to commit."
          exit 0
        fi

        git commit -m "Update dashboard outputs"

        git fetch origin main
        git rebase origin/main

        git push origin HEAD:main
